services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: lsi_attendance_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - attendance_private_storage:/var/www/html/storage/app/private
        environment:
            APP_ENV: ${APP_ENV:-local}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-attendance_lsi}
            DB_USERNAME: ${DB_USERNAME:-lsi_user}
            DB_PASSWORD: ${DB_PASSWORD:-lsi_secret}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - lsi_network

    nginx:
        image: nginx:1.27-alpine
        container_name: lsi_attendance_nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - lsi_network

    mysql:
        image: mysql:8.4
        container_name: lsi_attendance_mysql
        restart: unless-stopped
        ports:
            - '${DB_FORWARD_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
            MYSQL_DATABASE: ${DB_DATABASE:-attendance_lsi}
            MYSQL_USER: ${DB_USERNAME:-lsi_user}
            MYSQL_PASSWORD: ${DB_PASSWORD:-lsi_secret}
            TZ: UTC
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-p${DB_ROOT_PASSWORD:-root_secret}',
                ]
            interval: 5s
            timeout: 5s
            retries: 15
        networks:
            - lsi_network

    redis:
        image: redis:7-alpine
        container_name: lsi_attendance_redis
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '${REDIS_FORWARD_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - lsi_network

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: lsi_attendance_queue
        restart: unless-stopped
        working_dir: /var/www/html
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'redis',
                '--sleep=3',
                '--tries=3',
                '--max-time=3600',
            ]
        volumes:
            - .:/var/www/html
            - attendance_private_storage:/var/www/html/storage/app/private
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-attendance_lsi}
            DB_USERNAME: ${DB_USERNAME:-lsi_user}
            DB_PASSWORD: ${DB_PASSWORD:-lsi_secret}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - lsi_network

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: lsi_attendance_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: ['sh', '-c', 'php artisan schedule:work']
        volumes:
            - .:/var/www/html
            - attendance_private_storage:/var/www/html/storage/app/private
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-attendance_lsi}
            DB_USERNAME: ${DB_USERNAME:-lsi_user}
            DB_PASSWORD: ${DB_PASSWORD:-lsi_secret}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - lsi_network

    mailpit:
        image: axllent/mailpit:latest
        container_name: lsi_attendance_mailpit
        restart: unless-stopped
        ports:
            - '${MAILPIT_PORT:-8025}:8025'
            - '${MAIL_PORT:-1025}:1025'
        networks:
            - lsi_network

networks:
    lsi_network:
        driver: bridge

volumes:
    mysql_data:
    redis_data:
    attendance_private_storage:
