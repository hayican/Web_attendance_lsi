name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: attendance_lsi
          MYSQL_USER: lsi_user
          MYSQL_PASSWORD: lsi_secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -proot_secret" --health-interval=5s --health-timeout=5s --health-retries=15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: attendance_lsi
      DB_USERNAME: lsi_user
      DB_PASSWORD: lsi_secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Allow MySQL triggers
        run: |
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=attendance_lsi", "root", "root_secret", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $pdo->exec("SET GLOBAL log_bin_trust_function_creators = 1");'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check